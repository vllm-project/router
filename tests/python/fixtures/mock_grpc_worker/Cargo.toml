[package]
name = "mock-grpc-worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
vllm-proto = "0.2"
