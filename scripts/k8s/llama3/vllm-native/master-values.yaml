decode:
  parallelism:
    tensor: 1  # No tensor parallelism (TP=1)
    data: 16   # Advertise all 16 data parallel ranks
  create: true
  replicas: 1  # Only 1 master pod

  # Service configuration so workers can register with the coordinator
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8000
        targetPort: 8000
        protocol: TCP
      - name: rpc
        port: 13345
        targetPort: 13345
        protocol: TCP

  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"
      path: "/metrics"
      interval: "30s"

  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.0
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "1"
      - "--data-parallel-size"
      - "16"                   # 16 total ranks (1 master + 15 workers)
      - "--data-parallel-rank"
      - "0"                    # Master rank
      - "--data-parallel-address"
      - "$(POD_IP)"            # Master listens on its own IP
      - "--data-parallel-rpc-port"
      - "13345"
      - "--block-size"
      - "128"
      - "--max-model-len"
      - "32000"
      - "--disable-uvicorn-access-log"
    env:
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
    ports:
      - containerPort: 8000
        name: http
        protocol: TCP
      - containerPort: 13345
        name: rpc
        protocol: TCP
    resources:
      limits:
        memory: 400Gi
        cpu: "90"
        nvidia.com/gpu: "1"
      requests:
        memory: 400Gi
        cpu: "90"
        nvidia.com/gpu: "1"
    mountModelVolume: true  # Uses PVC - model cached!
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: shm
      mountPath: /dev/shm
    - name: torch-compile-cache
      mountPath: /.cache
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: "16Gi"
  - name: torch-compile-cache
    emptyDir: {}

prefill:
  create: false
