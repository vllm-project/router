multinode: false

modelArtifacts:
  uri: "hf://meta-llama/Llama-3.1-8B-Instruct"
  size: 200Gi
  authSecretName: "llm-d-hf-token"
  name: "meta-llama/Llama-3.1-8B-Instruct"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0
    connector: nixlv2
    secure: false

  inferencePool:
    create: false

  httpRoute:
    create: false

  epp:
    create: false

# RANK 0 - MASTER (using "decode" section)
# This is the master node that handles HTTP requests and coordinates DP
decode:
  parallelism:
    tensor: 1  # TP=1 (1 GPU per pod)
    data: 16   # DP=16 (16 pods total)
  create: true
  replicas: 1  # Only 1 master pod with 1 GPU

  # Service configuration - CRITICAL for workers (ranks 1-15) to connect
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8000
        targetPort: 8000
        protocol: TCP
      - name: rpc
        port: 13345
        targetPort: 13345
        protocol: TCP

  monitoring:
    podmonitor:
      enabled: true
      portName: "http"
      path: "/metrics"
      interval: "30s"

  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.0
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "1"                    # Use 1 GPU per pod (no TP)
      - "--data-parallel-size"
      - "16"                   # 16 ranks (16 pods total)
      - "--data-parallel-rank"
      - "0"                    # THIS IS RANK 0 (MASTER)
      - "--data-parallel-address"
      - "$(POD_IP)"            # Use own IP for master
      - "--data-parallel-rpc-port"
      - "13345"
      - "--block-size"
      - "128"
      - "--max-model-len"
      - "32000"
      - "--disable-log-requests"
    env:
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
    ports:
      - containerPort: 8000
        name: http
        protocol: TCP
      - containerPort: 13345
        name: rpc
        protocol: TCP
    resources:
      limits:
        memory: 100Gi
        cpu: "22"
        nvidia.com/gpu: "1"  # 1 GPU on this pod
      requests:
        memory: 100Gi
        cpu: "22"
        nvidia.com/gpu: "1"
    mountModelVolume: true  # Helm handles PVC automatically
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: shm
      mountPath: /dev/shm
    - name: torch-compile-cache
      mountPath: /.cache
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: "16Gi"
  - name: torch-compile-cache
    emptyDir: {}

# WORKERS (ranks 1-15) - Disabled in Helm, will use separate StatefulSet
prefill:
  create: false