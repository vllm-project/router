# Infra values
infra:
  gateway:
    gatewayClassName: istio

# MS values - simplified for multinode (no EPP needed)
ms:
  routing:
    proxy:
      debugLevel:
    epp:
      debugLevel:

  provider:
    name: istio
  istio:
    destinationRule:
      trafficPolicy:
        tls:
          mode: SIMPLE
          insecureSkipVerify: true
