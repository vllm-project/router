multinode: false  # Not using chart's multinode, doing manual

modelArtifacts:
  uri: "hf://meta-llama/Llama-3.1-8B-Instruct"
  size: 200Gi
  authSecretName: "llm-d-hf-token"
  name: "meta-llama/Llama-3.1-8B-Instruct"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0
    connector: nixlv2
    secure: false

  inferencePool:
    create: false

  httpRoute:
    create: false

  epp:
    create: false

# RANK 0 - MASTER (using "decode" section)
decode:
  parallelism:
    tensor: 1  # No tensor parallelism (TP=1)
    data: 8    # 8 data parallel workers (one per GPU)
  create: true
  replicas: 1  # Only 1 master pod

  # Service configuration - CRITICAL for rank 1 to connect
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8000
        targetPort: 8000
        protocol: TCP
      - name: rpc
        port: 13345
        targetPort: 13345
        protocol: TCP

  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"
      path: "/metrics"
      interval: "30s"

  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.0
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "1"
      - "--data-parallel-size"
      - "2"                    # 2 ranks (2 pods)
      - "--data-parallel-rank"
      - "0"                    # THIS IS RANK 0 (MASTER)
      - "--data-parallel-address"
      - "$(POD_IP)"            # Use own IP for master
      - "--data-parallel-rpc-port"
      - "13345"
      - "--block-size"
      - "128"
      - "--max-model-len"
      - "32000"
      - "--disable-uvicorn-access-log"
    env:
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
    ports:
      - containerPort: 8000
        name: http
        protocol: TCP
      - containerPort: 13345
        name: rpc
        protocol: TCP
    resources:
      limits:
        memory: 800Gi
        cpu: "180"
        nvidia.com/gpu: "8"
      requests:
        memory: 800Gi
        cpu: "180"
        nvidia.com/gpu: "8"
    mountModelVolume: true  # Uses PVC - model cached!
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: shm
      mountPath: /dev/shm
    - name: torch-compile-cache
      mountPath: /.cache
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: "16Gi"
  - name: torch-compile-cache
    emptyDir: {}

# RANK 1 - WORKER (cleverly using "prefill" section)
prefill:
  parallelism:
    tensor: 1  # No tensor parallelism (TP=1)
    data: 8    # 8 data parallel workers (one per GPU)
  create: true
  replicas: 1  # Only 1 worker pod

  # Ensure this goes to different node than rank 0
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ms-llama31-llm-d-modelservice-decode  # Anti-affinity with decode (rank 0)
      topologyKey: "kubernetes.io/hostname"

  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"
      path: "/metrics"
      interval: "30s"

  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.0
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "1"
      - "--data-parallel-size"
      - "2"                    # 2 ranks (same as rank 0)
      - "--data-parallel-rank"
      - "1"                    # THIS IS RANK 1 (WORKER)
      - "--data-parallel-address"
      # This needs to point to rank 0's service - fully qualified domain name
      # Format: <service-name>.<namespace>.svc.cluster.local
      - "ms-llama31-multinode-llm-d-modelservice-decode.llm-d-llama31-multinode.svc.cluster.local"
      - "--data-parallel-rpc-port"
      - "13345"
      - "--block-size"
      - "128"
      - "--max-model-len"
      - "32000"
      - "--disable-uvicorn-access-log"
    env:
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
    ports:
      - containerPort: 8000
        name: http
        protocol: TCP
      - containerPort: 13345
        name: rpc
        protocol: TCP
    resources:
      limits:
        memory: 800Gi
        cpu: "180"
        nvidia.com/gpu: "8"
      requests:
        memory: 800Gi
        cpu: "180"
        nvidia.com/gpu: "8"
    mountModelVolume: true  # SAME PVC as rank 0 - no redownload!
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: shm
      mountPath: /dev/shm
    - name: torch-compile-cache
      mountPath: /.cache
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: "16Gi"
  - name: torch-compile-cache
    emptyDir: {}
