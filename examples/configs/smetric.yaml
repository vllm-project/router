# SMetric selection: --policy kv_aware --smetric-config <this file>
# Set your TTFT SLO in token units; per-worker prefill rate is learned online
# (rolling P90 over streaming/gRPC first-token or P/D prefill latencies).
# Design and parameter roles: https://arxiv.org/html/2607.08565v2#S4.SS2

# User TTFT budget (seconds): TTFT_SLO_SECS + TTFT_SLO_SECS_PER_1K_TOKENS * (L / 1000),
# where L is prompt length in tokens (estimated as chars / 4 without KV Events).
# Both terms must be nonnegative, with at least one positive.
TTFT_SLO_SECS: 1.0
TTFT_SLO_SECS_PER_1K_TOKENS: 0.0625

# Optional context length L_eq (tokens) where attention matches linear prefill cost:
# prefill_cost = n + n * (L - n / 2) / L_eq, for n = max(L - hit, 0) uncached tokens.
# Defaults to 16384 (GQA dense/MoE and dense MLA). Set 0 for a pure linear model
# (recommended for DSA / sparse-attention models; use ~65536 for hybrid linear/SWA).
# ATTENTION_CROSSOVER_TOKENS: 16384

# Optional fixed processing rate in linear-token equivalents/sec (> 0). Omit to
# learn online; set explicitly for pure non-streaming HTTP deployments.
# PREFILL_RATE: 10000.0
