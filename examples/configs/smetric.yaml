# SMetric selection: --policy kv_aware --smetric-config <this file>
# These are example starting values. Calibrate the cost model for your deployment
# and set the TTFT and TPOT budgets to your service's latency requirements.
# Design and parameter roles: https://arxiv.org/html/2607.08565v2#S4.SS2

# Deployment calibration
# Estimated uncached prefill work = C_LIN * n + C_ATT * n * (L - n / 2).
# L is the full prompt length; n is its uncached length, both in characters.
# Local GPU KV-event token hits are converted to equivalent characters before
# evaluating this model.
# Only the ratio C_ATT / C_LIN affects dimensionless routing when PREFILL_RATE is
# learned online; C_LIN defaults to 1.0 when omitted.
C_LIN: 1.0

# Context-dependent attention work, in cost units/character^2.
# Increase relative to C_LIN if profiling shows stronger long-context cost.
C_ATT: 0.0001

# Optional fixed processing rate in the SAME cost units/second as above (> 0).
# Omit this key to learn a per-worker median (P50) concurrency-scaled prefill
# rate online from first-token observations.
# PREFILL_RATE: 10000.0

# Routing controls
# Unified dimensionless load functional on colocated worker w:
#   Phi(w) = ((Q_w + C_w) * (B_w + 1)) / (R_w * T_SLO(L)) + DECODE_WEIGHT * B_w
# where T_SLO(L) = SLACK * (TTFT_SLO_BASE + TTFT_SLO_PER_CHAR * L), and B_w is
# the number of active co-resident requests on worker w (0 in P/D prefill mode).
# A worker meets the latency budget iff Phi(w) <= 1.0.
SLACK: 1.0

# Standing decode contention weight (beta, alias BETA) per co-resident request.
# Omit this key to start from the 0.5 default and learn beta online from pure-decode
# inter-token step slopes (d_TPOT / d_B) normalized by (TPOT_SLO - tau_1).
# Set an explicit nonnegative value (e.g. 0.5) to pin a fixed decode weight.
# DECODE_WEIGHT: 0.5

# Target inter-token decode latency SLO in seconds (> 0), used to normalize
# online DECODE_WEIGHT learning when DECODE_WEIGHT is omitted.
TPOT_SLO: 0.020

# Train online prefill rate on all bound KV-event requests, including confirmed
# 0-block cold misses. Recommended true when omitting PREFILL_RATE under KV Events.
SAMPLE_ALL_EVENT_REQUESTS: true

# Cache-affinity evidence threshold, in [0, 1]. A candidate's local cached prefix
# must exceed HIT_RATIO * the expected reusable history to claim session affinity.
HIT_RATIO: 0.1

# User TTFT budget: BASE + PER_CHAR * L, in seconds.
# Both terms must be nonnegative, with at least one positive.
TTFT_SLO_BASE: 0.2
TTFT_SLO_PER_CHAR: 0.0001

# Tree maintenance (applies only to request-history Tree routing without KV Events).
MAX_TREE_SIZE: 67108864
EVICTION_INTERVAL_SECS: 30
