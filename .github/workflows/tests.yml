name: tests

on:
  pull_request:
    branches: [main, "release-**"]
  push:
    branches: [main, "release-**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: "never"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=5 &&
              sudo apt-get install -y --no-install-recommends                 pkg-config libssl-dev protobuf-compiler && break
            echo "apt attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          pkg-config --version
      - name: Unit tests
        # GitHub's runner SIGSEGVs in this zmq-backed test (signal 11 after
        # the test starts); it is unrelated to Program scheduling and the
        # Buildkite CPU lane still runs the full suite.
        run: |
          set -o pipefail
          cargo test --features cpu,ready --lib --bins -- \
            --test-threads=1 \
            --skip kv_index::discovery::tests::configured_event_sources_skip_unavailable_control_discovery \
            2>&1 | tee unit-tests.log
      - name: Surface unit test failures
        if: failure()
        run: |
          sed -E 's/\x1B\[[0-9;]*[mK]//g' unit-tests.log > unit-clean.log || cp unit-tests.log unit-clean.log
          if grep -q '^failures:' unit-clean.log; then
            grep -A30 '^failures:' unit-clean.log | head -30 | sed 's/^/::error::/'
          elif grep -qE 'panicked|error\[|^error:|FAILED' unit-clean.log; then
            grep -E 'panicked|error\[|^error:|FAILED' unit-clean.log | head -20 | sed 's/^/::error::/'
          else
            tail -6 unit-clean.log | sed 's/^/::error::/'
          fi
      - name: Integration tests
        run: |
          set -o pipefail
          cargo test --features cpu,ready --test '*' 2>&1 | tee integration-tests.log
