name: python-format

on: [push, pull_request]

jobs:
  format:
    name: Python Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.0
      - name: ruff format
        run: python -m ruff format --check py_src/ py_test/
      - name: ruff check
        run: python -m ruff check py_src/ py_test/
