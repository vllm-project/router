# Pre-commit hooks for vLLM Router
# Install with: pip install pre-commit && pre-commit install

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending

  # Rust formatting and linting
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: cargo fmt
      - id: clippy
        name: cargo clippy
        args: ['--all-targets', '--all-features', '--', '-D', 'warnings']

  # Ruff lint + format. Same shape as vllm-omni: a py3 wheel, no
  # language_version pin. Rev matches CI's ruff==0.16.0.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ['--fix', '--exit-non-zero-on-fix']
        files: ^(py_src|py_test)/.*\.py$
      - id: ruff-format
        files: ^(py_src|py_test)/.*\.py$

  # Test marks: Python level + machine marks, Rust level + machine features.
  - repo: local
    hooks:
      - id: check-mark
        name: Ensure tests have CI level and machine marks
        entry: python tools/pre_commit/check_test_marks.py
        language: system
        types_or: [python, rust]
        files: ^(py_test/|src/|tests/).*\.(py|rs)$

      # Install the universal mypy wheel into this hook's env. Do not use
      # mirrors-mypy: that builds from source and needs a pinned interpreter.
      - id: mypy
        name: Run mypy
        entry: mypy
        language: python
        types_or: [python, pyi]
        files: ^py_src/.*\.py$
        args: ['--ignore-missing-imports', '--scripts-are-modules']
        require_serial: true
        additional_dependencies:
          - mypy==1.11.1
          - types-requests
