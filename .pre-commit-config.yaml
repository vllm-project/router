# Pre-commit hooks for vLLM Router.
# This file is the only static-quality list. GitHub Actions runs it via
# .github/workflows/pre-commit.yml. Install with:
#   pip install pre-commit && pre-commit install

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes manifests in scripts/ are multi-document streams.
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
      - id: debug-statements

  # Rust formatting and linting
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: cargo fmt
      - id: clippy
        name: cargo clippy
        args: ['--all-targets', '--all-features', '--', '-D', 'warnings']

  # Python formatting with black. CI previously installed black unpinned;
  # keep the rev already used by this hook.
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3.12
        files: ^(py_src|py_test)/.*\.py$

  # Ruff lint. Rev matches the former Buildkite pin ruff==0.16.0.
  # The old hook id `ruff` was removed from ruff-pre-commit; `ruff-check`
  # is the same `ruff check` command.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ['--fix', '--exit-non-zero-on-fix']
        files: ^(py_src|py_test)/.*\.py$

  # Python type checking. Same hook as before; CI skips it while
  # `pre-commit run mypy --all-files` is still dirty.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        files: ^py_src/.*\.py$
        additional_dependencies: ['types-requests']

  # One spelling engine. Do not add codespell beside this hook.
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos

  # v1.7.8+ sets `go 1.24.0` in go.mod, which older Go toolchains (and most
  # current CI images) cannot parse. Pin to v1.7.7 until that is fixed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: local
    hooks:
      - id: shellcheck
        name: Lint shell scripts
        # language: script breaks on Windows (shebang paths lose slashes).
        # Invoke bash so Linux CI and Git Bash both work.
        entry: bash
        args: [tools/pre_commit/shellcheck.sh]
        language: system
        types: [shell]

      # Same schema check as vllm-omni. Router pipelines have no Omni-only
      # keys, so the hook validates the YAML directly.
      - id: check-buildkite
        name: Validate Buildkite Pipelines
        entry: python tools/pre_commit/check_buildkite.py
        language: python
        files: ^\.buildkite/.*\.ya?ml$
        additional_dependencies: [pyyaml, check-jsonschema==0.38.0]
