path = "tests/rust/otel_integration_test.rs"

[[test]]
name = "otel_openai_test"
path = "tests/rust/otel_openai_test.rs"

[[test]]
name = "otel_trace_test"
path = "tests/rust/otel_trace_test.rs"

[[test]]
name = "policy_registry_integration"
path = "tests/rust/policy_registry_integration.rs"

[[test]]
name = "request_formats_test"
path = "tests/rust/request_formats_test.rs"

[[test]]
name = "responses_api_test"
path = "tests/rust/responses_api_test.rs"

[[test]]
name = "router_overhead_bench"
path = "tests/rust/router_overhead_bench.rs"

[[test]]
name = "routing_edge_cases_test"
path = "tests/rust/routing_edge_cases_test.rs"

[[test]]
