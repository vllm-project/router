[package]
name = "vllm_router_rs"
version = "0.1.16"
edition = "2021"

[lib]
name = "vllm_router_rs"
# Pure Rust library: Just omit crate-type (defaults to rlib)
# Python/C binding + Rust library: Use ["cdylib", "rlib"]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vllm-router"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8.4", features = ["macros", "ws", "tracing"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = [
    "trace",
    "compression-gzip",
    "cors",
    "timeout",
    "limit",
    "request-id",
    "util",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
bytes = "1.8.0"
rand = "0.9.2"
reqwest = { version = "0.13", features = ["stream", "blocking", "json"] }
futures-util = "0.3"
futures = "0.3"
pyo3 = { version = "0.26", features = ["extension-module"] }
dashmap = "6.1.0"
http = "1.1.0"
tokio = { version = "1.42.0", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "chrono",
] }
tracing-log = "0.2"
tracing-appender = "0.2.3"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.28"
opentelemetry-http = "0.27"
chrono = "0.4"
kube = { version = "1.1.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.25.0", features = ["v1_33"] }
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
ulid = "1.2.1"
parking_lot = "0.12.4"
thiserror = "2.0.12"
regex = "1.10"
url = "2.5.4"
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow = "1.0"
dotenvy = "0.15"
tokenizers = { version = "0.22.2" }
tiktoken-rs = { version = "0.7.0" }
minijinja = { version = "2.0" }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
hf-hub = { version = "0.4.3", features = ["tokio"] }

deadpool = { version = "0.12", features = ["managed", "rt_tokio_1"] }
backoff = { version = "0.4", features = ["tokio"] }
strum = { version = "0.26", features = ["derive"] }
once_cell = "1.21.3"
zmq = "0.10.0"
lru = { version = "0.18", default-features = false }
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
wasmtime = { version = "36", default-features = false, features = [
    "component-model",
    "cranelift",
    "parallel-compilation",
    "pooling-allocator",
    "runtime",
] }
wasmtime-wasi = "36"
async-channel = "2"
# Must match vllm-proto (tonic 0.14 / prost 0.14). otel-otlp keeps its own
# tonic 0.12 copy for traces.
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
vllm-proto = "0.2"
# Rust crates in the vLLM tree (not pip). Unpublished on crates.io; Cargo
# finds the package by name under rust/src/. Override with a path patch
# to a local checkout if you already have the rust workspace.
vllm-chat = { git = "https://github.com/vllm-project/vllm", tag = "v0.29.0" }
vllm-tokenizer = { git = "https://github.com/vllm-project/vllm", tag = "v0.29.0" }
vllm-text = { git = "https://github.com/vllm-project/vllm", tag = "v0.29.0" }

[features]
# Every Rust test file is gated on these. `cargo test` compiles a group
# only when its features are passed, for example `--features cpu,ready`.
cpu = []
ready = []

[dev-dependencies]
libc = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
portpicker = "0.1"
tempfile = "3.8"
lazy_static = "1.4"
opentelemetry_sdk = { version = "0.27", features = ["testing"] }
# Per-process CPU and RSS accounting for the router overhead harness.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "request_processing"
harness = false
path = "benches/request_processing.rs"

[[bench]]
name = "tokenizer_benchmark"
harness = false
path = "benches/tokenizer_benchmark.rs"

[[bench]]
name = "tokenizer_cache_benchmark"
harness = false
path = "benches/tokenizer_cache_benchmark.rs"

[[bench]]
name = "routing_input"
harness = false
path = "benches/routing_input.rs"

[[bench]]
name = "otel_disabled_path"
harness = false
path = "benches/otel_disabled_path.rs"

# Cargo auto-discovers only tests/*.rs. Integration tests live under tests/rust/.
# Adding a file there requires a matching [[test]] entry; pre-commit hook
# check-rust-tests enforces that.
[[test]]
name = "api_endpoints_test"
path = "tests/rust/api_endpoints_test.rs"

[[test]]
name = "bench_corpus_test"
path = "tests/rust/bench_corpus_test.rs"

[[test]]
name = "benchmark_integration"
