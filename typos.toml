# Intentional tokens. codespell previously ignored aks, te, hel, wit, wast.
[default.extend-words]
aks = "aks"
AKS = "AKS"
te = "te"
hel = "hel"
Hel = "Hel"
wit = "wit"
wast = "wast"
# AMD ROCm runtime variable HSA_NO_SCRATCH_RECLAIM.
HSA = "HSA"
# vLLM multimodal field image_grid_thw (temporal, height, width).
thw = "thw"

[files]
extend-exclude = [
    "scripts/deepseek/*-oom-logs.txt",
    "tests/rust/fixtures/tokenizer/byte_level_bpe.json",
    # TraceLab subsets. tool_call_id values are opaque and must stay byte-stable.
    "tests/python/e2e/perf/router_policy/data/tracelab-ci-uniform-28.jsonl",
    "tests/python/e2e/perf/router_policy/data/tracelab-l4-6.jsonl",
]
