[pytest]
testpaths = py_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Registry for py_test/helpers/mark.py. Tags in the description are the contract:
# [ci-level] CI level, [hardware-resource] SKU,
# [hardware-platform] accelerator or device class,
# [hardware-cards] cards_{n}, [gpu] on a platform line also adds pytest.mark.gpu.
markers =
    ready: [ci-level] Tests selected for the ready CI level
    L4: [hardware-resource] [cuda] Tests that require an NVIDIA L4 GPU
    MI300: [hardware-resource] [rocm] Tests that require an AMD MI300X GPU
    cpu: [hardware-platform] Tests that run on CPU
    cuda: [hardware-platform] [gpu] NVIDIA CUDA
    rocm: [hardware-platform] [gpu] AMD ROCm
    gpu: [hardware-platform] [gpu] GPU device class; not a hardware_test res key
    cards_1: [hardware-cards] Tests that require 1 accelerator card
    cards_2: [hardware-cards] Tests that require 2 accelerator cards
    cards_4: [hardware-cards] Tests that require 4 accelerator cards
