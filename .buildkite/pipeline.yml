# Resolve docs-only PRs before scheduling builds or tests.
steps:
  - label: ":pipeline: Check docs-only PR and upload CI"
    if: '!(build.pull_request.labels includes "nightly-test")'
    command: python3 .buildkite/scripts/skip_docs.py
    agents:
      queue: "medium_cpu_queue_premerge"

  # Explicit nightly requests take precedence over docs-only detection.
  - label: ":pipeline: Upload requested nightly CI"
    if: 'build.pull_request.labels includes "nightly-test"'
    command: buildkite-agent pipeline upload .buildkite/bootstrap-upload-steps.yml
    agents:
      queue: "medium_cpu_queue_premerge"
