# vLLM Router CI/CD Pipeline
# This pipeline runs automated checks, builds, and tests for the vLLM Router project

env:
  RUST_IMAGE: "rust:1.95.0-bullseye"
  # Pin the ROCm nightly used by the MoRI lane so dependency changes are explicit.
  ROCM_VLLM_IMAGE: "vllm/vllm-openai-rocm:nightly@sha256:d22922d540810d90c5a3eafe91d3b4a62c2b881f3e990d0b7180b2875a5d176d"
  # Disable incremental compilation for consistent CI builds
  CARGO_INCREMENTAL: "0"
  # Enable full Rust backtraces for debugging
  RUST_BACKTRACE: "1"

steps:
  # ============================================================================
  # Fast Checks - Run in parallel for quick feedback
  # ============================================================================
  - group: ":mag: Fast Checks"
    key: "fast-checks"
    steps:
      - label: ":rust: Rust Format Check"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  rustup component add rustfmt
                  cargo fmt --check
        agents:
          queue: "cpu_queue_premerge"

      - label: ":rust: Clippy"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
                  rustup component add clippy
                  cargo clippy --all-targets --all-features -- -D warnings
        agents:
          queue: "cpu_queue_premerge"

      - label: ":python: Python Format Check"
        command: |
          pip install black ruff==0.16.0
          python -m black --check py_src/ py_test/
          python -m ruff check py_src/ py_test/
        agents:
          queue: "cpu_queue_premerge"

  # Wait for fast checks to pass before building
  - wait: ~
    continue_on_failure: false

  # ============================================================================
  # Build - Create release artifacts
  # ============================================================================
  - group: ":hammer: Build"
    key: "build"
    steps:
      - label: ":rust: Build Rust (Release)"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
                  cargo build --release
        artifact_paths:
          - "target/release/vllm-router"
        agents:
          queue: "cpu_queue_premerge"

      - label: ":python: Build Python Wheel"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler python3 python3-pip
                  pip3 install -U pip setuptools wheel setuptools-rust build
                  python3 -m build
        artifact_paths:
          - "dist/*.whl"
          - "dist/*.tar.gz"
        agents:
          queue: "cpu_queue_premerge"

  # Wait for builds to complete before testing
  - wait: ~
    continue_on_failure: false

  # ============================================================================
  # Tests - Run comprehensive test suite
  # ============================================================================
  - group: ":test_tube: Tests"
    key: "tests"
    steps:
      - label: ":rust: Rust Unit Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
                  cargo test --lib --bins
        agents:
          queue: "cpu_queue_premerge"

      - label: ":rust: Rust Integration Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
                  cargo test --test '*'
        agents:
          queue: "cpu_queue_premerge"

      - label: ":python: Python Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler python3 python3-pip
                  pip3 install -U pip setuptools wheel setuptools-rust
                  pip3 install -e .[dev]
                  pip3 install pytest pytest-cov pytest-asyncio
                  pytest py_test/ -v --ignore=py_test/e2e --cov=vllm_router --cov-report=xml --cov-report=term
        artifact_paths:
          - "coverage.xml"
        agents:
          queue: "cpu_queue_premerge"

  # ============================================================================
  # P/D Disaggregation Integration Test - Run on GPU queue
  # ============================================================================
  - label: ":satellite: P/D Disaggregation Test (4 GPUs)"
    key: "pd-disagg-test"
    # ROCm-only scheduled builds use the dedicated MI300X queue and should not
    # wait for an unrelated NVIDIA worker before the build can finish.
    if: build.env("ROCM_ONLY") != "1"
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: "*"
          limit: 2
      manual:
        allowed: true
        reason: "GPU tests can be flaky - retry if needed"
    plugins:
      - docker#v5.11.0:
          image: "nvidia/cuda:13.0.2-devel-ubuntu22.04"
          workdir: /workdir
          volumes:
            - ".:/workdir"
            - "/root/.cache/huggingface:/root/.cache/huggingface"
          runtime: nvidia
          gpus: all
          shm-size: "16g"
          environment:
            - "HF_TOKEN"
            - "VLLM_USE_V1=1"
            - "VLLM_LOGGING_LEVEL=INFO"
            - "UCX_TLS=all"
            - "UCX_NET_DEVICES=all"
          propagate-environment: true
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              # Verify HF_TOKEN is set (required for gated models like Llama)
              if [ -z "$${HF_TOKEN:-}" ]; then
                echo "ERROR: HF_TOKEN is not set. This is required for gated models."
                echo "Please configure HF_TOKEN as a Buildkite Secret in Organization Settings."
                exit 1
              fi
              echo "HF_TOKEN is configured."

              # Install system dependencies
              apt-get update && apt-get install -y \
                curl \
                ffmpeg \
                python3 \
                python3-pip \
                pkg-config \
                libssl-dev \
                protobuf-compiler \
                git

              # Install uv for fast Python package management
              curl -LsSf https://astral.sh/uv/install.sh | sh
              source /root/.local/bin/env

              # Create Python virtual environment (as recommended by vLLM)
              uv venv --python 3.12 --seed
              source .venv/bin/activate

              # Install vLLM with CUDA 13 support
              uv pip install vllm --torch-backend=cu130

              # Install NIXL library for P/D disaggregation
              uv pip install nixl-cu13
              uv pip install nixl --no-deps

              # Fail fast if CUDA-specific wheels do not match the CI image.
              python - <<'PY'
              import nixl
              import nixl_ep
              import torch
              import vllm

              assert torch.version.cuda and torch.version.cuda.startswith("13."), torch.version.cuda
              assert nixl._api.__name__.startswith("nixl_cu13."), nixl._api.__name__
              print(f"vLLM {vllm.__version__}, torch CUDA {torch.version.cuda}, {nixl._api.__name__}, {nixl_ep.__name__}")
              PY

              # Install test dependencies
              uv pip install requests pytest openai

              # Install LM Evaluation Harness with API extras for accuracy testing
              uv pip install 'lm-eval[api]>=0.4.0' hf_transfer

              # Install Rust for building the router
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source /root/.cargo/env

              # Build the router
              cargo build --release
              export PATH="/workdir/target/release:$$PATH"

              # Run P/D disaggregation test
              cd py_test/e2e/pd_disagg_vllm
              bash ./run_accuracy_test.sh
    agents:
      queue: "gpu_4_queue"
    depends_on: "build"
    artifact_paths:
      - "/tmp/router.log"

  # This queue is intentionally separate from the shared amd_mi300_* queues.
  # Those agents run with --no-plugins, while this lane needs the Docker plugin
  # to provide the pinned vLLM/MoRI userspace on a two-GPU xGMI host. Put the
  # condition on the group so fork builds cannot run plugin hooks.
  - group: ":large_purple_circle: ROCm MoRI XGMI P/D"
    key: "pd-disagg-moriio-tests"
    if: |
      build.branch == pipeline.default_branch ||
      build.merge_queue.base_branch == pipeline.default_branch ||
      (build.pull_request.id != null && build.pull_request.repository.fork == false) ||
      ((build.source == "ui" || build.source == "api") &&
       build.env("RUN_ROCM_XGMI") == "1")
    steps:
      - label: "ROCm MoRI XGMI (read_mode={{matrix.read_mode}}, 2 GPUs)"
        key: "pd-disagg-moriio-test"
        timeout_in_minutes: 60
        matrix:
          setup:
            read_mode:
              - "true"
              - "false"
        retry:
          automatic:
            - exit_status: "*"
              limit: 1
          manual:
            allowed: true
            reason: "Retry transient GPU-agent failures after inspecting the logs"
        plugins:
          - docker#v5.14.0:
              image: "$ROCM_VLLM_IMAGE"
              # vllm-openai images default to `vllm serve`; run the CI shell instead.
              entrypoint: ""
              workdir: /workdir
              volumes:
                - "/var/lib/buildkite-agent/.cache/huggingface:/root/.cache/huggingface"
              devices:
                - "/dev/kfd"
                - "/dev/dri"
              privileged: true
              init: true
              tty: false
              ipc: host
              mount-buildkite-agent: true
              chown: true
              chown-image: "busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616"
              shm-size: "256g"
              security-opts:
                - "seccomp=unconfined"
              ulimits:
                - "memlock=-1"
                - "stack=67108864"
              environment:
                - "MORIIO_READ_MODE={{matrix.read_mode}}"
                - "MORIIO_BACKEND=xgmi"
                - "MODEL_NAMES=Qwen/Qwen3-0.6B"
                - "ROUTER_BIN=/workdir/target/release/vllm-router"
                - "LOG_DIR=/workdir/target/ci-logs/moriio-{{matrix.read_mode}}"
                - "ENGINE_STARTUP_TIMEOUT=3600"
              propagate-environment: true
              command:
                - bash
                - -c
                - |
                  set -euo pipefail

                  # Reuse the release binary produced by the CPU build step.
                  buildkite-agent artifact download "target/release/vllm-router" .
                  chmod +x target/release/vllm-router
                  ldd target/release/vllm-router
                  target/release/vllm-router --version

                  # Pin the evaluation harness; vLLM and MoRI come from the pinned image.
                  python3 -m pip install --no-cache-dir \
                    requests \
                    openai \
                    'lm-eval[api]==0.4.12'

                  bash py_test/e2e/pd_disagg_vllm/run_moriio_accuracy_test.sh
        agents:
          queue: "router_rocm_mi300_2"
        depends_on: "build"
        artifact_paths:
          - "target/ci-logs/moriio-*/*.log"

  # One coordinator agent owns the paired MI300X worker over a dedicated SSH
  # link. Keeping this as one Buildkite job avoids coupled two-agent scheduling
  # and guarantees that both halves are cleaned up together.
  - label: ":large_purple_circle: ROCm MoRI RDMA P/D (read_mode={{matrix.read_mode}}, 2 nodes)"
    key: "pd-disagg-moriio-rdma-test"
    if: |
      (build.source == "schedule" && build.env("NIGHTLY") == "1") ||
      ((build.source == "ui" || build.source == "api") &&
       build.env("RUN_ROCM_RDMA") == "1")
    timeout_in_minutes: 75
    matrix:
      setup:
        read_mode:
          - "true"
          - "false"
    retry:
      automatic:
        - exit_status: "*"
          limit: 1
      manual:
        allowed: true
        reason: "Retry transient two-node GPU or RDMA failures after inspecting both node logs"
    command: |
      set -euo pipefail

      buildkite-agent artifact download "target/release/vllm-router" .
      chmod +x target/release/vllm-router
      ldd target/release/vllm-router
      target/release/vllm-router --version

      export MORIIO_READ_MODE="{{matrix.read_mode}}"
      export MODEL_NAMES="Qwen/Qwen3-0.6B"
      export ROUTER_BIN="$$PWD/target/release/vllm-router"
      export LOG_DIR="$$PWD/target/ci-logs/moriio-rdma-{{matrix.read_mode}}"
      export ENGINE_STARTUP_TIMEOUT=3600
      # amd_mori 1.0.0 is stable for sequential cross-node transfers on this
      # cluster. Concurrency 10 remains covered by the same-host XGMI lane.
      export NUM_LM_EVAL_CONCURRENT=1
      export WORKER_SSH_HOST=vllm-router-rocm-worker
      export COORDINATOR_FABRIC_IP=192.168.200.1
      export WORKER_FABRIC_IP=192.168.200.2

      bash py_test/e2e/pd_disagg_vllm/run_moriio_rdma_accuracy_test.sh
    agents:
      queue: "router_rocm_mi300_2"
    depends_on: "build"
    artifact_paths:
      - "target/ci-logs/moriio-rdma-*/*"

  # ============================================================================
  # Docker Build - Parallel with tests
  # ============================================================================
  - label: ":docker: Build Docker Image"
    command: |
      docker build -f Dockerfile.router -t vllm-router:${BUILDKITE_COMMIT} .
      docker tag vllm-router:${BUILDKITE_COMMIT} vllm-router:latest
    agents:
      queue: "cpu_queue_premerge"
    depends_on: "build"
