# vLLM Router test pipeline bootstrap.
# Builds the release binary and wheel, pushes the NVIDIA CI image, then
# uploads L1–L3 (issue #273).
# Image publish stays in release-pipeline.yml.
# NIGHTLY=1 on this pipeline selects tests. NIGHTLY=1 on router-release
# publishes images. Those are different pipelines.

env:
  RUST_IMAGE: "rust:1.95.0-bookworm"
  # Pin the ROCm nightly used by the MoRI lane so dependency changes are explicit.
  ROCM_VLLM_IMAGE: "vllm/vllm-openai-rocm:nightly@sha256:d22922d540810d90c5a3eafe91d3b4a62c2b881f3e990d0b7180b2875a5d176d"
  # Disable incremental compilation for consistent CI builds
  CARGO_INCREMENTAL: "0"
  # Enable full Rust backtraces for debugging
  RUST_BACKTRACE: "1"


steps:

  # ============================================================================
  # Build - Create release artifacts
  # ============================================================================
  - group: ":hammer: Build"
    key: "build"
    steps:
      - label: ":rust: Build Rust (Release)"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  bash .buildkite/scripts/install_packages.sh rust
                  cargo build --release
        artifact_paths:
          - "target/release/vllm-router"
        agents:
          queue: "medium_cpu_queue_premerge"

      - label: ":python: Build Python Wheel"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  source .buildkite/scripts/install_packages.sh python-wheel
                  python -m build
        artifact_paths:
          - "dist/*.whl"
          - "dist/*.tar.gz"
        agents:
          queue: "medium_cpu_queue_premerge"

  # After the CPU build, copy target/release/vllm-router into the image.
  # Steps that depend only on "build" start without waiting for this.
  # Ready smoke, nightly GSM8K, and nightly gRPC perf depend on this key.
  - label: ":docker: Build NVIDIA CI image"
    key: "image-build"
    depends_on: "build"
    if: |
      build.env("ROCM_ONLY") != "1" &&
      (
        (
          build.branch != pipeline.default_branch &&
          build.pull_request.labels includes "ready"
        ) ||
        (
          build.branch == pipeline.default_branch &&
          build.env("NIGHTLY") == "1"
        ) ||
        (
          build.branch != pipeline.default_branch &&
          build.pull_request.labels includes "nightly-test"
        )
      )
    command: bash .buildkite/scripts/build-ci-image.sh
    agents:
      queue: "medium_cpu_queue_premerge"

  # Uploads wait for the build group, not for image-build, and not for each other.
  # Uploaded jobs depend on their upload step. NVIDIA P/D jobs and the L3
  # gRPC perf job also wait for image-build.
  # L1: same gate as Omni READY_LABEL_IF. ROCM_ONLY stays on the smoke job.
  - label: ":pipeline: Upload L1 ready"
    key: "upload-ready-pipeline"
    depends_on: "build"
    if: |
      build.branch != pipeline.default_branch &&
      build.pull_request.labels includes "ready"
    command: |
      python3 .buildkite/scripts/upload_pipeline.py --upload .buildkite/test-ready.yml
    agents:
      queue: "medium_cpu_queue_premerge"

  # L2: default-branch push, its merge queue, or any other branch labeled
  # merge-test. test-merge.yml has no per-job gate. Scheduled main +
  # NIGHTLY=1 stays on L3 (same split as Omni MERGE_MAIN_IF).
  - label: ":pipeline: Upload L2 merge"
    key: "upload-merge-pipeline"
    depends_on: "build"
    if: |
      (
        build.branch == pipeline.default_branch &&
        build.env("NIGHTLY") != "1"
      ) ||
      build.merge_queue.base_branch == pipeline.default_branch ||
      (
        build.branch != pipeline.default_branch &&
        build.pull_request.labels includes "merge-test"
      )
    command: |
      python3 .buildkite/scripts/upload_pipeline.py --upload .buildkite/test-merge.yml
    agents:
      queue: "medium_cpu_queue_premerge"

  # L3: default-branch NIGHTLY=1, or any other branch labeled nightly-test.
  # Job-only gates stay in test-nightly.yml: ready overlap, ROCM_ONLY,
  # RUN_ROCM_XGMI, and the RDMA schedule/label/manual gate.
  - label: ":pipeline: Upload L3 nightly"
    key: "upload-nightly-pipeline"
    depends_on: "build"
    if: |
      (
        build.branch == pipeline.default_branch &&
        build.env("NIGHTLY") == "1"
      ) ||
      (
        build.branch != pipeline.default_branch &&
        build.pull_request.labels includes "nightly-test"
      )
    command: |
      python3 .buildkite/scripts/upload_pipeline.py --upload .buildkite/test-nightly.yml
    agents:
      queue: "medium_cpu_queue_premerge"
