# L2 merge (https://github.com/vllm-project/router/issues/273).
# pipeline.yml decides when this file is uploaded. Jobs here have no if.
# xGMI smoke is one read mode plus a short limit.
# RDMA smoke is SMOKE_ONLY in one direction.

env:
  RUST_IMAGE: "rust:1.95.0-bookworm"
  # Pin the ROCm nightly used by the MoRI lane so dependency changes are explicit.
  ROCM_VLLM_IMAGE: "vllm/vllm-openai-rocm:nightly@sha256:d22922d540810d90c5a3eafe91d3b4a62c2b881f3e990d0b7180b2875a5d176d"
  # Disable incremental compilation for consistent CI builds
  CARGO_INCREMENTAL: "0"
  # Enable full Rust backtraces for debugging
  RUST_BACKTRACE: "1"


steps:
  # L2 smoke: one read_mode and LM_EVAL_LIMIT=20. Full read+write is test-nightly.yml.
  # This queue is intentionally separate from the shared amd_mi300_* queues.
  # Those agents run --no-plugins, while this lane needs the Docker plugin
  # to provide the pinned vLLM/MoRI userspace on a two-GPU xGMI host.
  # Hosts restore the digest-pinned image before the job (#363). Full
  # read+write stays on test-nightly.yml.
  - group: ":large_purple_circle: ROCm MoRI XGMI smoke"
    key: "pd-disagg-moriio-smoke"
    depends_on: "upload-merge-pipeline"
    steps:
      - label: "ROCm MoRI XGMI smoke (read_mode=true, short limit, 2 GPUs)"
        key: "pd-disagg-moriio-smoke-job"
        timeout_in_minutes: 60
        retry:
          automatic:
            - exit_status: "*"
              limit: 1
          manual:
            allowed: true
            reason: "Retry transient GPU-agent failures after inspecting the logs"
        mirror_hardwares: mi300_2
        command: |
          bash -euo pipefail <<'BASH'
          export MORIIO_READ_MODE=true
          export LM_EVAL_LIMIT=20
          export MORIIO_BACKEND=xgmi
          export MODEL_NAMES=Qwen/Qwen3-0.6B
          export ROUTER_BIN=/workdir/target/release/vllm-router
          export LOG_DIR=/workdir/target/ci-logs/moriio-smoke
          export ENGINE_STARTUP_TIMEOUT=3600

          bash .buildkite/scripts/install_packages.sh router-bin
          bash .buildkite/scripts/install_packages.sh lm-eval

          bash tests/python/e2e/pd_disagg_vllm/run_moriio_accuracy_test.sh
          BASH
        artifact_paths:
          - "target/ci-logs/moriio-smoke/*.log"

  # L2: one cross-node completion (SMOKE_ONLY). Full read+write is test-nightly.yml.
  - label: ":large_purple_circle: ROCm MoRI RDMA smoke (read_mode=true, 2 nodes)"
    key: "pd-disagg-moriio-rdma-smoke"
    timeout_in_minutes: 75
    retry:
      automatic:
        - exit_status: "*"
          limit: 1
      manual:
        allowed: true
        reason: "Retry transient two-node GPU or RDMA failures after inspecting both node logs"
    command: |
      set -euo pipefail

      bash .buildkite/scripts/install_packages.sh router-bin

      export SMOKE_ONLY="true"
      export MORIIO_READ_MODE="true"
      export MODEL_NAMES="Qwen/Qwen3-0.6B"
      export ROUTER_BIN="$$PWD/target/release/vllm-router"
      export LOG_DIR="$$PWD/target/ci-logs/moriio-rdma-smoke"
      export ENGINE_STARTUP_TIMEOUT=3600
      export NUM_LM_EVAL_CONCURRENT=1
      export WORKER_SSH_HOST=vllm-router-rocm-worker
      export COORDINATOR_FABRIC_IP=192.168.200.1
      export WORKER_FABRIC_IP=192.168.200.2

      bash tests/python/e2e/pd_disagg_vllm/run_moriio_rdma_accuracy_test.sh
    mirror_hardwares: mi300_rdma
    depends_on: "upload-merge-pipeline"
    artifact_paths:
      - "target/ci-logs/moriio-rdma-smoke/*"
