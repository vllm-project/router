# L3 nightly (https://github.com/vllm-project/router/issues/273).
# pipeline.yml uploads this file for NIGHTLY=1 or nightly-test, including forks.
# Jobs whose gate is narrower than that upload keep their own if.
# NIGHTLY=1 on this test pipeline runs tests without publishing images.

env:
  RUST_IMAGE: "rust:1.95.0-bookworm"
  # Pin the ROCm nightly used by the MoRI lane so dependency changes are explicit.
  ROCM_VLLM_IMAGE: "vllm/vllm-openai-rocm:nightly@sha256:d22922d540810d90c5a3eafe91d3b4a62c2b881f3e990d0b7180b2875a5d176d"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

steps:
  - group: "Unit Test"
    key: "nightly-tests"
    depends_on: "upload-nightly-pipeline"
    # Skip when L1 is also uploaded. test-ready.yml runs these three jobs.
    if: |
      build.branch == pipeline.default_branch ||
      !(build.pull_request.labels includes "ready")
    steps:
      - label: ":rust: Rust Unit Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  bash .buildkite/scripts/install_packages.sh rust
                  bash .buildkite/scripts/rust_coverage.sh unit
        artifact_paths:
          - "target/coverage/rust-unit/lcov.info"
        agents:
          queue: "medium_cpu_queue_premerge"

      - label: ":rust: Rust Integration Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  bash .buildkite/scripts/install_packages.sh rust
                  bash .buildkite/scripts/rust_coverage.sh integration
        artifact_paths:
          - "target/coverage/rust-integration/lcov.info"
        agents:
          queue: "medium_cpu_queue_premerge"

      - label: ":python: Python Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              mount-buildkite-agent: true
              command:
                - bash
                - -c
                - |
                  source .buildkite/scripts/install_packages.sh python
                  pytest tests/python/ -v --ignore=tests/python/e2e -m "ready and cpu" --cov=vllm_router --cov-report=xml --cov-report=term
        artifact_paths:
          - "coverage.xml"
        agents:
          queue: "medium_cpu_queue_premerge"

  - group: "Cuda Test"
    steps:
      # ============================================================================
      # L3 P/D full GSM8K — EKS l4-k8s (4x L4). Not the default PR job.
      # ============================================================================
      - label: ":test_tube: Function · HTTP P/D Disaggregation (4 GPUs) Test"
        key: "pd-disagg-test"
        # image-build is skipped when ROCM_ONLY=1. A skipped dependency is treated
        # as satisfied, so this job must use the same condition.
        if: build.env("ROCM_ONLY") != "1"
        timeout_in_minutes: 60
        mirror_hardwares: l4_4
        # vLLM, NIXL, lm-eval, and vllm-router are on PATH in the CI image.
        command: bash tests/python/e2e/pd_disagg_vllm/run_accuracy_test.sh
        depends_on:
          - "upload-nightly-pipeline"
          - "image-build"
        artifact_paths:
          - "/tmp/router.log"

      # ============================================================================
      # L3 Rust gRPC P/D full GSM8K — same layout as the HTTP job above: one
      # prefill and one decode, each at data-parallel size 2, on four L4s.
      # ============================================================================
      - label: ":test_tube: Function · gRPC P/D Disaggregation (4 GPUs) Test"
        key: "grpc-pd-disagg-test"
        if: build.env("ROCM_ONLY") != "1"
        timeout_in_minutes: 60
        mirror_hardwares: l4_4
        # vLLM 0.30.0, NIXL, lm-eval, and vllm-router are in the CI image.
        env:
          RUN_LM_EVAL: "1"
          LOG_DIR: /tmp/vllm-router-grpc-pd
        command: pytest tests/python/integration/test_grpc_pd_disagg.py -v -m "ready and L4 and cards_4"
        depends_on:
          - "upload-nightly-pipeline"
          - "image-build"
        artifact_paths:
          - "/tmp/vllm-router-grpc-pd/*.log"

      # ============================================================================
      # L3 gRPC prefix-KV perf — rust_grpc + python_http, H100×2.
      # c16-r32 (hit 0 and 0.99) plus hit 0.99 at c4-r8 and c64-r128.
      # Pulls the router CI image from image-build (vLLM + vllm-router on PATH).
      # ============================================================================
      - label: ":bar_chart: Perf · gRPC Prefix KV Test"
        key: "grpc-perf-e2e"
        # image-build is skipped when ROCM_ONLY=1. A skipped dependency is treated
        # as satisfied, so this job must use the same condition.
        if: build.env("ROCM_ONLY") != "1"
        timeout_in_minutes: 90
        mirror_hardwares: h100_2
        depends_on:
          - "upload-nightly-pipeline"
          - "image-build"
        command:
          - "python -m pytest -sv tests/python/e2e/perf/grpc -k \"c16-r32 or hit99-c4 or hit99-c64\" --perf-case=rust_grpc"
          - "python -m pytest -sv tests/python/e2e/perf/grpc -k \"c16-r32 or hit99-c4 or hit99-c64\" --perf-case=python_http"
        # Dashboard copies tests/python/e2e/results only.
        artifact_paths:
          - "tests/python/e2e/results/perf/grpc/**/*.json"

      # ============================================================================
      # L3 router_policy replay — merged TraceLab and disaggregated AgentX at c8.
      # 4× vllm-rs + router per cell (12GiB GPU KV/worker, no CPU offload) → L4×4.
      # TRACELAB_JSONL_URL overrides merged traces; PD uses a SHA256-pinned slice.
      # ============================================================================
      - label: ":bar_chart: Perf · PD Merge Router Policy (c8) Test"
        key: "router-policy-perf-e2e"
        if: build.env("ROCM_ONLY") != "1"
        timeout_in_minutes: 90
        mirror_hardwares: l4_4
        depends_on:
          - "upload-nightly-pipeline"
          - "image-build"
        env:
          AGENTX_CELL_GAP_SEC: "${AGENTX_CELL_GAP_SEC:-15}"
          AGENTX_PORT_SETTLE_SEC: "${AGENTX_PORT_SETTLE_SEC:-5}"
        command: python -m pytest -sv tests/python/e2e/perf/router_policy/test_router_policy_scenarios.py -k 'pd_merge and c8'
        # Performance JSON for the dashboard, plus the cell files used to diagnose a run.
        artifact_paths:
          - "tests/python/e2e/results/perf/router_policy/**/*"
          - "tests/python/e2e/run/perf/router_policy/c*-*/**/*"

      - label: ":bar_chart: Perf · PD Disaggregated Router Policy (c8) Test"
        key: "router-policy-pd-disagg-perf-e2e"
        if: build.env("ROCM_ONLY") != "1"
        timeout_in_minutes: 90
        mirror_hardwares: l4_4
        depends_on:
          - "upload-nightly-pipeline"
          - "image-build"
        env:
          AGENTX_CELL_GAP_SEC: "${AGENTX_CELL_GAP_SEC:-15}"
          AGENTX_PORT_SETTLE_SEC: "${AGENTX_PORT_SETTLE_SEC:-5}"
        command: python -m pytest -sv tests/python/e2e/perf/router_policy/test_router_policy_scenarios.py -k 'pd_disagg and c8'
        # Performance JSON for the dashboard, plus the cell files used to diagnose a run.
        artifact_paths:
          - "tests/python/e2e/results/perf/router_policy/**/*"
          - "tests/python/e2e/run/perf/router_policy/c*-*/**/*"

      # ============================================================================
      # L3 L1 prefix-encoding perf — hit 0.30 and 0.99999 at c4 and c16, 1× L4.
      # Same router CI image as the other NVIDIA jobs (vLLM + vllm-router on PATH).
      # Case default is Qwen/Qwen3-0.6B, TP1, GPU 0. One pytest session: worker
      # stays up through L1 on, then worker and router cold-start before L1 off.
      # Both L1 on and L1 off; 8 waves (2 hit rates × c4/c16 × 2 arms).
      # ============================================================================
      - label: ":bar_chart: Perf · L1 Prefix Encoding Test"
        key: "l1-encode-perf-e2e"
        # image-build is skipped when ROCM_ONLY=1. A skipped dependency is treated
        # as satisfied, so this job must use the same condition.
        if: build.env("ROCM_ONLY") != "1"
        timeout_in_minutes: 90
        mirror_hardwares: l4_1
        depends_on:
          - "upload-nightly-pipeline"
          - "image-build"
        command: python -m pytest -sv tests/python/e2e/perf/l1_encode/test_l1_encode.py -k "(hit0.30 or hit0.99999) and (c4 or c16)"
        # Dashboard copies tests/python/e2e/results only.
        artifact_paths:
          - "tests/python/e2e/results/perf/l1_encode/**/*.json"

  - group: "AMD TestGroup"
    key: "pd-disagg-moriio-tests"
    steps:
      # This queue is intentionally separate from the shared amd_mi300_* queues.
      # Those agents run --no-plugins, while this lane needs the Docker plugin
      # to provide the pinned vLLM/MoRI userspace on a two-GPU xGMI host.
      # Hosts restore the digest-pinned image before the job (#363). This is the
      # L3 matrix, not the old "every trusted PR" condition. The one-mode smoke
      # lives in test-merge.yml. nightly-test includes forks.
      - label: "ROCm MoRI XGMI (read_mode={{matrix.read_mode}}, 2 GPUs)"
        key: "pd-disagg-moriio-test"
        depends_on: "upload-nightly-pipeline"
        if: |
          build.env("NIGHTLY") == "1" ||
          (
            build.branch != pipeline.default_branch &&
            build.pull_request.labels includes "nightly-test"
          ) ||
          ((build.source == "ui" || build.source == "api") &&
           build.env("RUN_ROCM_XGMI") == "1")
        timeout_in_minutes: 60
        matrix:
          setup:
            read_mode:
              - "true"
              - "false"
        mirror_hardwares: mi300_2
        env:
          MORIIO_READ_MODE: "{{matrix.read_mode}}"
          MORIIO_BACKEND: "xgmi"
          MODEL_NAMES: "Qwen/Qwen3-0.6B"
          ROUTER_BIN: "/workdir/target/release/vllm-router"
          LOG_DIR: "/workdir/target/ci-logs/moriio-{{matrix.read_mode}}"
          ENGINE_STARTUP_TIMEOUT: "3600"
        command:
          - "bash .buildkite/scripts/install_packages.sh router-bin"
          - "bash .buildkite/scripts/install_packages.sh lm-eval"
          - "bash tests/python/e2e/pd_disagg_vllm/run_moriio_accuracy_test.sh"
        artifact_paths:
          - "target/ci-logs/moriio-*/*.log"

      # One coordinator agent owns the paired MI300X worker over a dedicated SSH
      # link. Keeping this as one Buildkite job avoids coupled two-agent scheduling
      # and guarantees that both halves are cleaned up together.
      - label: ":large_purple_circle: ROCm MoRI RDMA P/D (read_mode={{matrix.read_mode}}, 2 nodes)"
        key: "pd-disagg-moriio-rdma-test"
        if: |
          (build.source == "schedule" && build.env("NIGHTLY") == "1") ||
          (
            build.branch != pipeline.default_branch &&
            build.pull_request.labels includes "nightly-test"
          ) ||
          ((build.source == "ui" || build.source == "api") &&
           build.env("RUN_ROCM_RDMA") == "1")
        timeout_in_minutes: 75
        matrix:
          setup:
            read_mode:
              - "true"
              - "false"
        # amd_mori 1.0.0 is stable for sequential cross-node transfers on this
        # cluster. Concurrency 10 remains covered by the same-host XGMI lane.
        env:
          MORIIO_READ_MODE: "{{matrix.read_mode}}"
          MODEL_NAMES: "Qwen/Qwen3-0.6B"
          ROUTER_BIN: "target/release/vllm-router"
          LOG_DIR: "target/ci-logs/moriio-rdma-{{matrix.read_mode}}"
          ENGINE_STARTUP_TIMEOUT: "3600"
          NUM_LM_EVAL_CONCURRENT: "1"
          WORKER_SSH_HOST: "vllm-router-rocm-worker"
          COORDINATOR_FABRIC_IP: "192.168.200.1"
          WORKER_FABRIC_IP: "192.168.200.2"
        command:
          - "bash .buildkite/scripts/install_packages.sh router-bin"
          - "bash tests/python/e2e/pd_disagg_vllm/run_moriio_rdma_accuracy_test.sh"
        mirror_hardwares: mi300_rdma
        depends_on: "upload-nightly-pipeline"
        artifact_paths:
          - "target/ci-logs/moriio-rdma-*/*"
